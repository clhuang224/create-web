name: Publish

# Publishes to GitHub Packages for testing; npm publishing comes later.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@clhuang224'

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm run build

      # Prereleases (e.g. 0.1.0-alpha.0) go to the "next" dist-tag so they never become "latest".
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
